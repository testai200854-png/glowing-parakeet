<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Note Record</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../theme-manager.js" defer></script>
  <style>
    .structured-report {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #f8fafc;
      color: #334155;
      font-size: 0.92rem;
      line-height: 1.55;
    }
    .report-score {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 800;
    }
    .report-section { margin-bottom: 12px; }
    .report-section ul { margin: 5px 0 0 20px; }
    .model-answer { color: #166534; }
    .report-advice {
      padding: 9px 11px;
      border-radius: 7px;
      background: #fffbeb;
      color: #92400e;
    }
    .report-advice ul { margin: 5px 0 0 20px; }
    .report-underline {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-decoration-color: #10b981;
      font-weight: 700;
    }
    .report-extra-note {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
      color: #64748b;
      font-size: 0.82rem;
    }
    .muted { color: #64748b; }
    .note-action-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-share {
      background-color: #f0fdf4;
      color: #166534;
      border-color: #bbf7d0;
    }
    .btn-share:hover {
      background-color: #dcfce7;
    }
    .btn-save {
      background-color: #eff6ff;
      color: #1e40af;
      border-color: #bfdbfe;
    }
    .btn-save:hover {
      background-color: #dbeafe;
    }
    .btn-delete {
      background-color: #fef2f2;
      color: #991b1b;
      border-color: #fecaca;
    }
    .btn-delete:hover {
      background-color: #fee2e2;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="navbar">
      <div class="nav-group nav-left">
        <a href="../dashboard/index.html" class="nav-logo">🧪 DSE Chem Hub</a>
        <a href="../dashboard/index.html" class="nav-item">Home</a>
      </div>

      <div class="nav-group nav-center">
        <a href="../simulations/index.html" class="nav-item">Simulations</a>
        <a href="../ai-assistant/index.html" class="nav-item">AI Marking</a>
        <a href="../qa-practice/index.html" class="nav-item">Quiz Generator</a>
        <a href="../notes/index.html" class="nav-item active">Notes</a>
      </div>

      <div class="nav-group nav-right">
        <div class="settings-dropdown">
          <button id="settingsBtn" class="settings-btn" type="button">⚙️ Settings</button>
          <div id="settingsMenu" class="dropdown-content hidden">
            <div class="theme-toggle"><span>Theme:</span><button id="lightThemeBtn" type="button" data-action="toggle-light">☀️ Light</button><button id="darkThemeBtn" type="button" data-action="toggle-dark">🌙 Dark</button></div>
            <button id="helpBtn" class="dropdown-item" type="button" data-action="show-help">📚 Help & Support</button>
            <button id="logoutBtn" class="dropdown-item danger" type="button" data-action="logout">🚪 Log Out</button>
          </div>
        </div>
      </div>
    </header>

    <section class="note-card">
      <div class="page-header">
        <div class="page-title">
          <div class="eyebrow">Chemistry note archive</div>
          <h2>Review saved chapters and part-based revision notes at a glance.</h2>
        </div>
      </div>

      <div class="note-controls">
        <label>
          Chapter &amp; Topic
          <select id="topicSelect" class="note-select"></select>
        </label>
        <label>
          Part
          <select id="partSelect" class="note-select"></select>
        </label>
      </div>

      <div class="note-list" id="noteList"></div>
    </section>
  </div>

  <script>
    const noteList = document.getElementById('noteList');
    const topicSelect = document.getElementById('topicSelect');
    const partSelect = document.getElementById('partSelect');

    const syllabusTopics = {
      'Ch1-4 Planet Earth': [
        'Part 0: Introduction to Chemistry',
        'Part 1: Atmosphere',
        'Part 2: Ocean',
        'Part 3: Crust'
      ],
      'Ch5-9 Microscopic World I': [
        'Part 1: Atomic Structure, Isotopes & Periodic Trends',
        'Part 2: Chemical Bonding & Octet Rule',
        'Part 3: Structures and Properties of Substances'
      ],
      'Ch10-13 Metals': [
        'Part 1: Reactivity Series of Metals & Displacement',
        'Part 2: Extraction Methods & Mole Calculations',
        'Part 3: Corrosion of Metals & Protection Methods'
      ],
      'Ch14-19 Acids and Bases': [
        'Part 1: Introduction to Acids, Alkalis & pH Scale',
        'Part 2: Indicators, Neutralization & Salt Preparation',
        'Part 3: Volumetric Analysis & Titration Stoichiometry'
      ],
      'Ch20-22 Fossil Fuels & Carbon Compounds': [
        'Part 1: Sources of Hydrocarbons & Fractional Distillation',
        'Part 2: Homologous Series, Alkanes & Alkenes',
        'Part 3: Addition Polymers, Plastics & Pollution',
        'Part 4 : Addition Polymerization'
      ],
      'Ch23-25 Microscopic World II': [
        'Part 1: Shapes of Molecules & VSEPR Theory',
        'Part 2: Bond Polarity & Electronegativity',
        'Part 3: Intermolecular Forces & Hydrogen Bonding'
      ],
      'Ch26-29 Redox Reactions, Chemical Cells & Electrolysis': [
        'Part 1: Oxidation Numbers & Balancing Redox Equations',
        'Part 2: Chemical Cells & Electrochemical Series',
        'Part 3: Electrolysis, Electroplating & Industrial Applications'
      ],
      'Ch30-32 Chemical Reactions & Energy': [
        'Part 1: Exothermic & Endothermic Enthalpy Changes',
        'Part 2: Calorimetry & Enthalpy Determination',
        'Part 3: Hess\'s Law & Enthalpy Cycles'
      ],
      'Ch33-35 Rate of Reaction': [
        'Part 1: Reaction Rate Monitoring Methods',
        'Part 2: Factors Affecting Rate & Collision Theory',
        'Part 3: Catalysts & Activation Energy'
      ]
    };

    const topicOptions = ['All Chapters & Topics', ...Object.keys(syllabusTopics)];

    const topicAliases = {
      'Topic 1: Planet Earth': 'Ch1-4 Planet Earth',
      'Topic 2: Microscopic World I': 'Ch5-9 Microscopic World I',
      'Topic 3: Metals': 'Ch10-13 Metals',
      'Topic 4: Acids and Bases': 'Ch14-19 Acids and Bases',
      'Topic 5: Fossil Fuels and Carbon Compounds': 'Ch20-22 Fossil Fuels & Carbon Compounds',
      'Topic 6: Microscopic World II': 'Ch23-25 Microscopic World II',
      'Topic 7: Redox Reactions, Chemical Cells and Electrolysis': 'Ch26-29 Redox Reactions, Chemical Cells & Electrolysis',
      'Topic 8: Chemical Reactions and Energy': 'Ch30-32 Chemical Reactions & Energy',
      'Topic 9: Rate of Reaction': 'Ch33-35 Rate of Reaction'
    };

    const partAliases = {
      'Part 1: Acids and Alkalis': 'Part 1: Introduction to Acids, Alkalis & pH Scale',
      'Part 3: Standard Solutions, Acid Strength & pH Scale': 'Part 1: Introduction to Acids, Alkalis & pH Scale'
    };

    function normalizeTopic(topic) {
      return topicAliases[topic] || topic || 'All Chapters & Topics';
    }

    function normalizePart(part) {
      return partAliases[part] || part || 'All Parts';
    }

    const sampleNote = {
      topic: 'Ch20-22 Fossil Fuels & Carbon Compounds',
      part: 'Part 4 : Addition Polymerization',
      query: 'Suggest why polystyrene does not have a constant relative molecular mass. (2 marks)',
      babySteps: [
        '❰ X ❱ (addition polymerisation) involves random chain termination.',
        'Different polymer chains stop growing at different times, giving ❰ Y ❱ (different chain lengths).',
        'Therefore the polymer has a range of relative molecular masses rather than one fixed value.'
      ],
      showFlat: [
        'Explain why a sample of low-density polyethylene (LDPE) melts over a range of temperatures rather than at a sharp melting point. (2 marks)'
      ],
      showFact: ''
    };

    function loadNotes() {
      const stored = JSON.parse(localStorage.getItem('dse-notes') || '[]');
      if (!stored.length) return [sampleNote];
      const sanitized = stored.map(note => sanitizeSavedNote(note));
      return sanitized.length ? sanitized : [sampleNote];
    }

    function isPlaceholderField(value) {
      return typeof value === 'string' && /unassigned/i.test(value.trim());
    }

    function sanitizeSavedNote(note) {
      const normalized = {
        ...note,
        topic: isPlaceholderField(note.topic) ? '' : note.topic || '',
        part: isPlaceholderField(note.part) ? '' : note.part || '',
        query: note.query || note.question || note.body || ''
      };

      if (normalized.query.toLowerCase().includes('polystyrene')) {
        return {
          ...sampleNote,
          _original: note
        };
      }
      return normalized;
    }

    function extractHeading(value) {
      if (!value) return '';
      const match = value.match(/^(.*?)(?:\s*-\s*Part\s*\d[:]?.*)$/i);
      return match ? match[1].trim() : value;
    }

    function extractPart(value) {
      if (!value) return '';
      const match = value.match(/(Part\s*\d[:]?.*)$/i);
      return match ? match[1].trim() : '';
    }

    function normalizeNote(note, index) {
      const resolved = {
        ...note,
        topic: note.topic || extractHeading(note.title) || '',
        part: note.part || extractPart(note.title) || '',
        query: note.query || note.question || note.body || ''
      };
      return {
        _index: index,
        topic: resolved.topic,
        part: resolved.part,
        query: resolved.query,
        babySteps: Array.isArray(note.babySteps)
          ? note.babySteps
          : typeof note.babySteps === 'string'
            ? note.babySteps.split('\n').map(line => line.trim()).filter(Boolean)
            : [],
        showFlat: Array.isArray(note.showFlat)
          ? note.showFlat
          : typeof note.showFlat === 'string'
            ? note.showFlat.split('\n').map(line => line.trim()).filter(Boolean)
            : [],
        showFact: note.showFact || note.showFactText || ''
      };
    }

    function saveNotes(notes) {
      localStorage.setItem('dse-notes', JSON.stringify(notes));
    }

    function displayToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast-message';
      toast.textContent = message;
      document.body.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('visible'));
      setTimeout(() => {
        toast.classList.remove('visible');
        toast.addEventListener('transitionend', () => toast.remove(), { once: true });
      }, 2200);
    }

    function saveCard(index) {
      const raw = loadNotes();
      const note = raw[index];
      const stored = JSON.parse(localStorage.getItem('dse-notes') || '[]');
      if (stored.length === 0) {
        stored.push(note);
      } else {
        stored[index] = note;
      }
      saveNotes(stored);
      displayToast('Note saved successfully');
      renderNoteCards();
    }

    function editCard(index) {
      const raw = loadNotes();
      const note = raw[index];
      const query = window.prompt('Edit question', note.query || '');
      if (query === null) return;
      const babyStepsInput = window.prompt('Edit baby steps (one per line)', note.babySteps.join('\n'));
      if (babyStepsInput === null) return;
      const showFlatInput = window.prompt('Edit Show Flat text (one line per entry)', note.showFlat.join('\n'));
      if (showFlatInput === null) return;
      const showFact = window.prompt('Edit Show Fact', note.showFact || '');
      if (showFact === null) return;
      note.query = query.trim();
      note.babySteps = babyStepsInput.split('\n').map(line => line.trim()).filter(Boolean);
      note.showFlat = showFlatInput.split('\n').map(line => line.trim()).filter(Boolean);
      note.showFact = showFact.trim();
      const stored = JSON.parse(localStorage.getItem('dse-notes') || '[]');
      stored[index] = note;
      saveNotes(stored);
      displayToast('Note edited and saved');
      renderNoteCards();
    }

    function shareCard(index) {
      const note = normalizeNote(loadNotes()[index], index);
      const payload = [
        `Topic: ${note.topic}`,
        `Part: ${note.part}`,
        `Question: ${note.query}`,
        `Baby Steps:\n${note.babySteps.join('\n')}`,
        `Show Flat:\n${note.showFlat.join('\n')}`,
        note.showFact ? `Show Fact:\n${note.showFact}` : ''
      ].filter(Boolean).join('\n\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(payload).then(() => {
          displayToast('Note copied to clipboard');
        }).catch(() => {
          window.prompt('Copy this note content:', payload);
        });
      } else {
        window.prompt('Copy this note content:', payload);
      }
    }

    function populateTopicSelect() {
      topicSelect.innerHTML = '';
      topicOptions.forEach(topic => {
        const option = document.createElement('option');
        option.value = topic;
        option.textContent = topic;
        topicSelect.appendChild(option);
      });
    }

    function populatePartSelect(topic) {
      partSelect.innerHTML = '';
      const defaultOption = document.createElement('option');
      defaultOption.value = 'All Parts';
      defaultOption.textContent = 'All Parts';
      partSelect.appendChild(defaultOption);

      if (topic === 'All Chapters & Topics') {
        const allParts = Array.from(new Set(Object.values(syllabusTopics).flat())).sort();
        allParts.forEach(part => {
          const option = document.createElement('option');
          option.value = part;
          option.textContent = part;
          partSelect.appendChild(option);
        });
        return;
      }

      const parts = syllabusTopics[topic] || [];
      parts.forEach(part => {
        const option = document.createElement('option');
        option.value = part;
        option.textContent = part;
        partSelect.appendChild(option);
      });
    }

    function shouldRender(note) {
      const topicMatch = topicSelect.value === 'All Chapters & Topics' || note.topic === topicSelect.value;
      const partMatch = partSelect.value === 'All Parts' || note.part === partSelect.value;
      return topicMatch && partMatch;
    }

    function deleteNote(index) {
      const notes = loadNotes();
      notes.splice(index, 1);
      localStorage.setItem('dse-notes', JSON.stringify(notes));
      renderNoteCards();
    }

    function getAutoSavedNotes() {
      const storageKeys = ["dse_chem_notes", "chemistry_notes", "dse_saved_notes"];
      const merged = [];
      storageKeys.forEach((key) => {
        try {
          const parsed = JSON.parse(localStorage.getItem(key) || "[]");
          if (Array.isArray(parsed)) merged.push(...parsed);
        } catch (error) {
          // ignore malformed storage entries
        }
      });
      return Array.from(new Map(merged.map(note => [note.id || `${note.question}_${note.timestamp}`, note])).values());
    }

    function saveAutoSavedNotes(notes) {
      const normalized = Array.isArray(notes) ? notes : [];
      ["dse_chem_notes", "chemistry_notes", "dse_saved_notes"].forEach((key) => {
        localStorage.setItem(key, JSON.stringify(normalized));
      });
    }

    function deleteAutoSavedNote(noteId) {
      let savedNotes = getAutoSavedNotes();
      savedNotes = savedNotes.filter(note => note.id !== noteId);
      saveAutoSavedNotes(savedNotes);
      renderSavedNotes();
    }

    function formatReport(text) {
      if (!text) return '';

      return text
        .replace(/&lt;(\/?)p&gt;/gi, '<$1p>')
        .replace(/&lt;(\/?)ul&gt;/gi, '<$1ul>')
        .replace(/&lt;(\/?)li&gt;/gi, '<$1li>')
        .replace(/&lt;span style=&quot;color:\s*(green|red|#008000|#dc2626|#16a34a|#22c55e);?&quot;&gt;([\s\S]*?)&lt;\/span&gt;/gi, '<span style="color: $1;">$2</span>')
        .replace(/&lt;strong style=&quot;color: #3b82f6;&quot;&gt;/gi, '<strong style="color: #3b82f6;">')
        .replace(/&lt;(\/?)strong&gt;/gi, '<$1strong>')
        .replace(/&lt;u&gt;([\s\S]*?)&lt;\/u&gt;/gi, '<span class="report-underline">$1</span>')
        .replace(/text-decoration:\s*underline;?/gi, '')
        .replace(/&lt;div style=&quot;background-color: #e8f5e9; border-left: 4px solid #2e7d32; padding: 12px 16px; border-radius: 8px; margin-top: 15px; font-weight: bold; font-size: 1.1em; color: #1b5e20;&quot;&gt;([\s\S]*?)&lt;\/div&gt;/gi, '<div style="background-color: #e8f5e9; border-left: 4px solid #2e7d32; padding: 12px 16px; border-radius: 8px; margin-top: 15px; font-weight: bold; font-size: 1.1em; color: #1b5e20;">$1</div>')
        .replace(/###\s*(.*)/g, '<h6 style="margin:16px 0 8px; color:#2563eb; font-weight:700;">$1</h6>')
        .replace(/---/g, '<hr style="margin:14px 0; border:0; border-top:1px solid #e5e7eb;">')
        .replace(/^\*\s*(.*)/gm, '• $1')
        .replace(/\n/g, '<br>');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderInlineMarkup(value) {
      return escapeHtml(value)
        .replace(/&lt;span style=&quot;color:\s*(green|red|#008000|#dc2626|#16a34a|#22c55e);?&quot;&gt;([\s\S]*?)&lt;\/span&gt;/gi, '<span style="color: $1;">$2</span>')
        .replace(/&lt;u&gt;([\s\S]*?)&lt;\/u&gt;/gi, '<span class="report-underline">$1</span>')
        .replace(/text-decoration:\s*underline;?/gi, '');
    }

    function splitReportPayload(report) {
      if (!report || typeof report === 'object') {
        return { analysis: report && typeof report === 'object' ? report : null, extraNote: '' };
      }

      const text = String(report).trim();
      if (!text.startsWith('{')) return { analysis: null, extraNote: '', raw: text };

      let depth = 0;
      let inString = false;
      let escaped = false;
      let end = -1;
      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        if (inString) {
          if (escaped) escaped = false;
          else if (character === '\\') escaped = true;
          else if (character === '"') inString = false;
          continue;
        }
        if (character === '"') inString = true;
        else if (character === '{') depth += 1;
        else if (character === '}') {
          depth -= 1;
          if (depth === 0) {
            end = index + 1;
            break;
          }
        }
      }

      try {
        const parsed = JSON.parse(text.slice(0, end > 0 ? end : text.length));
        return {
          analysis: parsed && typeof parsed === 'object' ? parsed : null,
          extraNote: end > 0 ? text.slice(end).replace(/^\s*[-–]\s*/, '').trim() : ''
        };
      } catch (error) {
        return { analysis: null, extraNote: '', raw: text };
      }
    }

    function renderList(value, className = '') {
      const items = Array.isArray(value) ? value : value ? [value] : [];
      if (!items.length) return '<span class="muted">No details provided.</span>';
      return `<ul class="${className}">${items.map(item => `<li>${renderInlineMarkup(item)}</li>`).join('')}</ul>`;
    }

    function renderReportCard(note) {
      const markdownReport = note.aiResponse || note.evaluation;
      if (markdownReport && typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true, headerIds: false });
        return `<div class="ai-feedback-container">${marked.parse(String(markdownReport))}</div>`;
      }

      const payload = splitReportPayload(note.report || note.content);
      const analysis = payload.analysis;
      if (!analysis) return `<div class="report-content">${formatReport(escapeHtml(payload.raw || note.report || note.content || ''))}</div>`;

      return `
        <div class="structured-report">
          <div class="report-score">Score: ${escapeHtml(analysis.score || 'N/A')}</div>
          <div class="report-section"><strong>Overall:</strong> ${renderInlineMarkup(analysis.overallComments || 'No overall comments.')}</div>
          <div class="report-section"><strong>Detailed Analysis:</strong>${renderList(analysis.detailedAnalysis)}</div>
          <div class="report-section model-answer"><strong>Model Answer:</strong>${renderList(analysis.modelAnswer)}</div>
          <div class="report-advice"><strong>Advice:</strong>${renderList(analysis.advice)}</div>
          ${payload.extraNote ? `<div class="report-extra-note">${renderInlineMarkup(payload.extraNote)}</div>` : ''}
        </div>`;
    }

    async function deleteServerNote(id) {
      if (!window.confirm('確定要刪除這筆筆記嗎？')) return;

      try {
        const response = await fetch(`/api/notes/${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('刪除筆記失敗');
        const card = document.getElementById(`server-note-${id}`);
        if (card) card.remove();
        await fetchAndRenderNotes();
      } catch (error) {
        window.alert(`刪除失敗：${error.message}`);
      }
    }

    async function shareServerNote(id) {
      const card = document.getElementById(`server-note-${id}`);
      if (!card) return;

      try {
        await navigator.clipboard.writeText(card.innerText);
        window.alert('筆記內容已複製到剪貼簿！');
      } catch (error) {
        window.alert('複製失敗，請手動複製。');
      }
    }

    function saveServerNote(id) {
      const card = document.getElementById(`server-note-${id}`);
      if (!card) return;

      const blob = new Blob([card.innerText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `HKDSE_Chem_Note_${id}.txt`;
      link.click();
      URL.revokeObjectURL(url);
    }

    async function fetchAndRenderNotes() {
      const notesContainer = document.getElementById("notes-list-container") || document.getElementById("noteList");
      if (!notesContainer) return;

      try {
        const response = await fetch('/api/notes');
        if (!response.ok) {
          throw new Error('Failed to fetch notes from server');
        }

        const savedNotes = await response.json();
        const filteredNotes = savedNotes.filter((note) => {
          const matchTopic = topicSelect.value === 'All Chapters & Topics' || normalizeTopic(note.topic) === topicSelect.value;
          const matchPart = partSelect.value === 'All Parts' || normalizePart(note.part) === partSelect.value;
          return matchTopic && matchPart;
        });

        if (!filteredNotes.length) {
          notesContainer.innerHTML = `
            <div style="text-align:center; color:#7f8c8d; padding:40px;">
                <p>📭 目前沒有自動儲存的 AI 溫習紀錄。</p>
            </div>`;
          return;
        }

        notesContainer.innerHTML = filteredNotes.map(note => {
          const topicLabel = normalizeTopic(note.topic || note.chapter);
          const partLabel = normalizePart(note.part);
          return `
            <div id="server-note-${escapeHtml(note.id)}" class="saved-note-card" style="background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:25px; margin-bottom:25px; box-shadow:0 4px 10px rgba(0,0,0,0.02); border-left:5px solid #27ae60;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #f1f5f9; padding-bottom:10px;">
                  <div>
                      <span style="background:#e8f8f0; color:#27ae60; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; margin-right:10px;">
                          ${escapeHtml(topicLabel)}
                      </span>
                      <span style="background:#eef2ff; color:#4f46e5; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; margin-right:10px;">
                          ${escapeHtml(partLabel)}
                      </span>
                      <span style="color:#7f8c8d; font-size:12px;">📅 ${escapeHtml(note.createdAt || note.timestamp || 'Just now')}</span>
                  </div>
              </div>
                  <div style="display:flex; justify-content:flex-end; gap:8px; margin-bottom:12px;">
                    <button type="button" onclick="shareServerNote('${escapeHtml(note.id)}')" title="Share">🔗 Share</button>
                    <button type="button" onclick="saveServerNote('${escapeHtml(note.id)}')" title="Save">💾 Save</button>
                    <button type="button" onclick="deleteServerNote('${escapeHtml(note.id)}')" title="Delete" style="color:#dc2626;">🗑️ Delete</button>
                  </div>
              <div class="note-content-body" style="font-size:15px; line-height:1.6;">
                  <div style="margin-bottom:12px;"><strong>Question:</strong> ${escapeHtml(note.question || '')}</div>
                  <div style="margin-bottom:12px;"><strong>Answer:</strong> ${escapeHtml(note.answer || '')}</div>
                  ${renderReportCard(note)}
              </div>
          </div>
          `;
        }).join('');
      } catch (error) {
        console.error('Failed to load AI notes from server:', error);
        notesContainer.innerHTML = `
          <div style="text-align:center; color:#7f8c8d; padding:40px;">
              <p>📭 目前沒有自動儲存的 AI 溫習紀錄。</p>
          </div>`;
      }
    }

    function renderSavedNotes() {
      fetchAndRenderNotes();
    }

    function formatLineBlock(lines, withBullet = false) {
      return lines
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => `${withBullet ? '• ' : ''}${line}`)
        .join('<br>');
    }

    function renderNoteCards() {
      const rawNotes = loadNotes();
      const notes = rawNotes.map((note, idx) => normalizeNote(note, idx));
      noteList.innerHTML = '';

      const filtered = notes.filter(shouldRender);
      if (!filtered.length) {
        noteList.innerHTML = '<div class="saved-note-card"><p>No saved notes match the selected chapter and part.</p></div>';
        return;
      }

      filtered.forEach(note => {
        const card = document.createElement('div');
        card.className = 'saved-note-card';
        card.innerHTML = `
          <div class="saved-note-card-header">
            <div>
              <div class="saved-note-card-title">${note.topic}</div>
              <div class="note-card-meta">${note.part}</div>
            </div>
            <button class="delete-btn" data-index="${note._index}" aria-label="Delete note">🗑️ Delete</button>
          </div>
          <div class="saved-note-content">
            <div class="saved-note-part">
              <span class="note-badge">🏷️ ${note.topic}</span>
            </div>
            <div class="saved-note-part">
              <span class="note-badge">📌 ${note.part}</span>
            </div>
            <div class="saved-note-part">
              <span class="note-badge">🧩 Structure & Examples</span>
              <p><strong>Question:</strong> ${note.query}</p>
              <p><strong>👣 Baby Steps:</strong><br>${formatLineBlock(note.babySteps, true)}</p>
              <p><strong>🤟 Show Flat:</strong><br>${formatLineBlock(note.showFlat)}</p>
              ${note.showFact ? `<p><strong>💡 Show Fact:</strong><br>${note.showFact}</p>` : ''}
            </div>
          </div>
          <div class="saved-note-actions">
            <button class="card-action-btn primary">💾 Save</button>
            <button class="card-action-btn outline">✏️ Edit</button>
            <button class="card-action-btn secondary">🔗 Share</button>
          </div>
        `;
        noteList.appendChild(card);
      });

      noteList.querySelectorAll('.delete-btn').forEach(button => {
        button.addEventListener('click', (event) => {
          deleteNote(parseInt(event.currentTarget.dataset.index, 10));
        });
      });

      noteList.querySelectorAll('.card-action-btn').forEach(button => {
        const index = parseInt(button.closest('.saved-note-card').querySelector('.delete-btn').dataset.index, 10);
        if (button.classList.contains('primary')) {
          button.addEventListener('click', () => saveCard(index));
        }
        if (button.classList.contains('outline')) {
          button.addEventListener('click', () => editCard(index));
        }
        if (button.classList.contains('secondary')) {
          button.addEventListener('click', () => shareCard(index));
        }
      });
    }

    topicSelect.addEventListener('change', () => {
      populatePartSelect(topicSelect.value);
      renderNoteCards();
      renderSavedNotes();
    });
    partSelect.addEventListener('change', () => {
      renderNoteCards();
      renderSavedNotes();
    });
    window.addEventListener('storage', () => {
      renderNoteCards();
      renderSavedNotes();
    });

    populateTopicSelect();
    populatePartSelect(topicSelect.value);
    renderNoteCards();
    renderSavedNotes();
  </script>
</body>
</html>
