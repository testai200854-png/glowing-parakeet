<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kwun Tong Maryknoll College - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body {
      min-height: 100%;
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.18), transparent 20%),
                  linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
      color: #0f172a;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.12), transparent 18%),
                  radial-gradient(circle at 80% 30%, rgba(14, 165, 233, 0.09), transparent 16%);
      pointer-events: none;
      opacity: 0.85;
      filter: blur(28px);
    }

    .login-card {
      position: relative;
      width: min(100%, 520px);
      border-radius: 32px;
      padding: 36px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(15, 23, 42, 0.06);
      backdrop-filter: blur(18px);
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    }

    .login-card .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #ef4444 0%, #8b5cf6 100%);
      color: #ffffff;
      font-size: 1.35rem;
      box-shadow: 0 14px 30px rgba(239, 68, 68, 0.18);
    }

    .school-name {
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.2;
    }

    .school-name span {
      display: block;
      font-size: 0.92rem;
      color: #475569;
      font-weight: 500;
    }

    .login-card h1 {
      font-size: clamp(1.8rem, 2.2vw, 2.4rem);
      color: #0f172a;
      margin-bottom: 10px;
      line-height: 1.05;
    }

    .login-card p.subtitle {
      color: #64748b;
      margin-bottom: 30px;
      font-size: 0.96rem;
      line-height: 1.7;
      max-width: 100%;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      color: #475569;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: #f8fbff;
      color: #0f172a;
      padding: 16px 16px 16px 46px;
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
    }

    .input-wrapper input:focus {
      border-color: rgba(14, 165, 233, 0.4);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
      background: #ffffff;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 1.05rem;
      pointer-events: none;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: #ffffff;
      color: #475569;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .password-toggle:hover {
      background: #f1f5f9;
      transform: translateY(-50%) scale(1.02);
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .remember-me {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #475569;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .remember-me input {
      width: 18px;
      height: 18px;
      accent-color: #0ea5e9;
      border-radius: 5px;
      cursor: pointer;
    }

    .help-link {
      color: #0f56d2;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .help-link:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #0ea5e9 0%, #0b75c2 100%);
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(14, 165, 233, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 30px rgba(14, 165, 233, 0.24);
    }

    .signup-text {
      margin-top: 24px;
      color: #64748b;
      font-size: 0.94rem;
      text-align: center;
    }

    .signup-text a {
      color: #0f56d2;
      font-weight: 700;
      text-decoration: none;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 560px) {
      .login-card {
        padding: 28px 20px;
      }

      .options-row {
        flex-direction: column;
        align-items: stretch;
      }

      .help-link {
        text-align: right;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-row">
      <div class="brand-mark">KT</div>
      <div class="school-name">
        Kwun Tong Maryknoll College
        <span>Student login portal</span>
      </div>
    </div>

    <h1>Integrated DSE Chemistry Platform</h1>
    <p class="subtitle">Welcome back! Please enter your details.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="emailInput">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input id="emailInput" name="email" type="email" placeholder="s220116@ktmc.edu.hk" value="s220116@ktmc.edu.hk" required />
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input id="passwordInput" name="password" type="password" placeholder="••••••••" value="KTMC123" required />
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">👁️</button>
        </div>
      </div>

      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" checked />
          Remember me
        </label>
        <a href="#" class="help-link">Need help signing in?</a>
      </div>

      <button type="submit" class="btn-login">Login</button>
    </form>

    <p class="signup-text">
      Don't have an account? <a href="#">Sign Up</a>
    </p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('passwordInput');
    const togglePassword = document.getElementById('togglePassword');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePassword.textContent = isPassword ? '🙈' : '👁️';
      togglePassword.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      loginForm.querySelector('.btn-login').textContent = 'Logging in...';
      setTimeout(() => {
        window.location.href = 'dashboard/';
      }, 450);
    });
  </script>
</body>
</html>
